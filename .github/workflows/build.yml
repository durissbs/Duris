name: compile test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Replace obsolete PR runs while retaining every master/scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # The regression suite is CPU-bound, so four shards run it in parallel. Each shard
    # builds the server; the compiler cache below keeps that and the harness compiles cheap.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
    - name: sysinfo
      run: echo -en '\e[33;1mThread count:\e[0m ' && nproc && free -h
    - name: build-deps
      run: |
        sudo apt-get update
        sudo apt-get install --yes equivs
        make build-deps-package
        sudo apt-get install --yes ./bin/packages/duris-build-deps_1.0_all.deb
    - name: check required executables
      run: |
        for tool in git python3 dos2unix gawk nc gdb valgrind clang-format redis-server redis-cli \
                    mysql mysqldump mysql_config mariadb-install-db mariadbd; do
          command -v "$tool" || { echo "::error::$tool is not installed"; exit 1; }
        done
    # tests/run_regression_tests.py already routes harness compiles through ccache
    # (scripts/mutate/g++, cache in bin/test-ccache); keep that cache between runs.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: bin/test-ccache
        key: test-ccache-${{ matrix.shard }}-${{ github.run_id }}
        restore-keys: |
          test-ccache-${{ matrix.shard }}-
          test-ccache-
    - name: build and test
      env:
        CCACHE_DIR: ${{ github.workspace }}/bin/test-ccache
        CCACHE_MAXSIZE: 2G
      run: |
        ccache --zero-stats
        make test-all -j"$(nproc)" TEST_JOBS="$(nproc)" TEST_SHARD="${{ matrix.shard }}/4" CC='ccache g++'
        ccache --show-stats
        # Save only what this run used, so each saved cache stays one run's working set.
        ccache --evict-older-than "$((SECONDS + 60))s"

    # Reuse the server already built by shard 1. Run the database journey
    # only for changes to the account transfer or its persistence entry points.
    - name: Focused sideswap MariaDB journey
      if: matrix.shard == 1 && github.event_name == 'pull_request'
      run: |
        if git diff --quiet HEAD^1 HEAD -- src/account/wiz_sideswap.c src/account/account.c src/account/account.h src/world/epic.c tests/async/run_sideswap_journey.py .github/workflows/build.yml; then
          echo 'No sideswap-related changes'
          exit 0
        fi
        tests/async/with_disposable_mariadb.sh python3 tests/async/run_sideswap_journey.py --server bin/server/dms_new

  # One stable check for branch rules to require, whatever the shard count.
  result:
    name: compile test
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - name: every shard passed
      run: test "${{ needs.build.result }}" = success
